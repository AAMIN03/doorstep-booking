# Tests run without Redis; integration tests use Testcontainers MySQL only.
# This file replaces src/main/resources/application.properties on the test classpath,
# so Jackson settings that the IST check depends on are repeated here.
rate-limit.enabled=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
