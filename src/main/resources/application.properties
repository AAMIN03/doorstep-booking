spring.application.name=doorstep-booking
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/doorstep?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.jackson.time-zone=Asia/Kolkata

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# Redis-backed rate limiting (Bucket4j). If Redis is unreachable at startup, limiting is skipped.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:20}
rate-limit.window-minutes=${RATE_LIMIT_WINDOW_MINUTES:1}
rate-limit.redis.host=${REDIS_HOST:localhost}
rate-limit.redis.port=${REDIS_PORT:6379}
